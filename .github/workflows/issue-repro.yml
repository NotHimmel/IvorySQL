name: issue-repro

# Execute the reproduction SQL from an issue against current master and post
# the real output back. Facts only; the workflow never draws a conclusion.
#
# Two things carry the security model; everything else is defence in depth:
#   1. The job that runs the SQL has an empty GITHUB_TOKEN scope
#      (permissions: {}) and no secrets, so there is nothing there to steal.
#   2. The SQL runs as a non-superuser role, which closes COPY FROM PROGRAM,
#      pg_read_file, lo_export and untrusted PL creation in one move.
#
# A separate report job holds issues: write and never executes user input.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

concurrency:
  group: issue-repro-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # Decide whether to run, and what to run
  # ---------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    permissions:
      issues: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      oracle: ${{ steps.decide.outputs.oracle }}
      sql: ${{ steps.decide.outputs.sql }}
      mode: ${{ steps.decide.outputs.mode }}
      encoding: ${{ steps.decide.outputs.encoding }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: stefanbuck/github-issue-parser@v3
        id: parse
        with:
          issue-body: ${{ github.event.issue.body }}
          template-path: .github/ISSUE_TEMPLATE/bug_report.yml

      - id: decide
        uses: actions/github-script@v7
        env:
          FIELDS: ${{ steps.parse.outputs.jsonString }}
        with:
          script: |
            // Only jsonString is reliable; the per-field outputs come back empty
            const f = JSON.parse(process.env.FIELDS || "{}");
            const strip = s => (s || "")
              .replace(/^\s*```[a-zA-Z]*\s*\n/, "")
              .replace(/\n\s*```\s*$/, "")
              .trim();

            const sql = strip(f.repro);
            core.setOutput("sql", sql);
            core.setOutput("mode", (f.compatible_mode || "").trim());
            core.setOutput("encoding", (f.server_encoding || "").trim());
            console.log(`parsed: mode=${f.compatible_mode} enc=${f.server_encoding} sqlLen=${sql.length}`);

            const issue = context.payload.issue;
            const isComment = context.eventName === "issue_comment";
            const cmd = isComment
              ? (context.payload.comment.body || "").trim().toLowerCase()
              : "";

            let run = false, oracle = false;

            if (isComment) {
              // Manual trigger. The Oracle side is heavy (multi-GB image,
              // minutes to first open), so it only runs when asked for.
              if (cmd === "/repro") run = true;
              if (cmd === "/repro oracle") { run = true; oracle = true; }
            } else {
              // Automatic: only for bug reports that passed hard validation
              const labels = issue.labels.map(l => l.name);
              run = labels.includes("bug") && !labels.includes("invalid");
            }

            // Skip obviously incomplete SQL; running it only produces noise
            if (sql.length < 20 || !sql.includes(";")) {
              console.log("repro SQL missing or too short; skipping.");
              run = false;
            }

            core.setOutput("run", String(run));
            core.setOutput("oracle", String(oracle));

  # ---------------------------------------------------------------
  # Execute. This job holds no credentials.
  # ---------------------------------------------------------------
  run:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}          # GITHUB_TOKEN with no scopes at all
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libreadline-dev \
                libicu-dev zlib1g-dev libxml2-dev libxslt-dev libssl-dev \
                uuid-dev libossp-uuid-dev

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-repro
          restore-keys: ${{ runner.os }}-repro
          max-size: 600M

      - name: build
        env:
          CC: ccache gcc
        run: |
          # Explicit set -e: bash's -e does not fire for a non-final command
          # in an && list, so `make && make install` would silently skip the
          # install and still leave the step green.
          set -eux -o pipefail
          ./configure --prefix="$PWD/inst" --with-icu --with-libxml \
                      --with-libxslt --with-openssl --enable-rpath \
                      --with-uuid=e2fs --with-ossp-uuid
          # IvorySQL's initdb creates these extensions and fails fatally if
          # any is missing:
          #   plpgsql, plisql   in src
          #   gb18030_2022      contrib
          #   ivorysql_ora      contrib; its preload_ora_misc.sql in turn
          #                     does CREATE EXTENSION "uuid-ossp"
          # So src alone is not enough, but all of contrib is not needed.
          make -j"$(nproc)" -C src
          make -C src install
          for m in gb18030_2022 uuid-ossp ivorysql_ora; do
            make -j"$(nproc)" -C "contrib/$m"
            make -C "contrib/$m" install
          done
          test -x "$PWD/inst/bin/initdb"        # fail loudly if install did not happen

      # User SQL reaches disk through env and node, never through the shell.
      - name: materialise repro SQL
        uses: actions/github-script@v7
        env:
          REPRO_SQL: ${{ needs.plan.outputs.sql }}
        with:
          script: |
            // The markdown fence was already stripped in plan
            const fs = require("fs");
            fs.mkdirSync("repro", { recursive: true });
            fs.writeFileSync("repro/user.sql", process.env.REPRO_SQL || "");

      - name: decide the run matrix
        uses: actions/github-script@v7
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          ENCODING: ${{ needs.plan.outputs.encoding }}
          REPRO_SQL: ${{ needs.plan.outputs.sql }}
        with:
          script: |
            const fs = require("fs");
            const sql = process.env.REPRO_SQL || "";
            const declaredEnc = (process.env.ENCODING || "").trim();
            const declaredMode = (process.env.MODE || "").trim();

            // Compatible mode
            const modes =
              /both modes/i.test(declaredMode) ? ["oracle", "pg"]
              : declaredMode === "pg"       ? ["pg"]
              : ["oracle"];                 // default, and for "unrelated to mode"

            // Encoding: the declared one, plus UTF8 and SQL_ASCII when the SQL
            // contains non-ASCII, which is what exposes encoding-dependent claims
            const KNOWN = ["UTF8", "GB18030", "SQL_ASCII", "EUC_CN"];
            const encs = new Set();
            if (KNOWN.includes(declaredEnc)) encs.add(declaredEnc);
            else encs.add("UTF8");
            if (/[^\x00-\x7F]/.test(sql)) { encs.add("UTF8"); encs.add("SQL_ASCII"); }

            fs.writeFileSync("repro/encodings.txt", [...encs].join("\n") + "\n");
            fs.writeFileSync("repro/matrix.json",
              JSON.stringify([...encs].flatMap(e => modes.map(m => ({ enc: e, mode: m })))));

      - name: init cluster
        run: |
          set -eu
          export PATH="$PWD/inst/bin:$PATH"
          export LD_LIBRARY_PATH="$PWD/inst/lib"
          # Unix socket only; no TCP listener
          initdb -D "$PWD/pgdata" -U super --no-sync -A trust >/dev/null
          mkdir -p /tmp/rs
          pg_ctl -D "$PWD/pgdata" -l "$PWD/pg.log" \
                 -o "-c listen_addresses='' -k /tmp/rs -p 55999" start
          sleep 2

      - name: create databases and unprivileged role
        run: |
          set -eu
          export PATH="$PWD/inst/bin:$PATH"
          export LD_LIBRARY_PATH="$PWD/inst/lib"
          PSQL="psql -h /tmp/rs -p 55999 -U super -v ON_ERROR_STOP=1 -q"

          $PSQL -d postgres <<'SQL'
          CREATE ROLE repro LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE
                            NOREPLICATION NOBYPASSRLS;
          ALTER ROLE repro SET statement_timeout = '30s';
          ALTER ROLE repro SET lock_timeout = '5s';
          ALTER ROLE repro SET idle_in_transaction_session_timeout = '30s';
          ALTER ROLE repro SET temp_file_limit = '256MB';
          ALTER ROLE repro SET search_path = repro, public;
          SQL

          for enc in $(cat repro/encodings.txt); do
            createdb -h /tmp/rs -p 55999 -U super \
                     --template=template0 --locale=C --encoding="$enc" "db_$enc"
            $PSQL -d "db_$enc" <<'SQL'
          -- Give the role its own schema; public stays read-only
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          CREATE SCHEMA repro AUTHORIZATION repro;
          SQL
          done

      - name: execute
        run: |
          set -eu
          export PATH="$PWD/inst/bin:$PATH"
          export LD_LIBRARY_PATH="$PWD/inst/lib"
          echo "sha=$(git rev-parse HEAD)" > repro/meta.txt

          python3 - <<'PY'
          import json, subprocess
          cells = json.load(open("repro/matrix.json"))
          user = open("repro/user.sql").read()
          out = []
          for c in cells:
              script = f"SET ivorysql.compatible_mode = {c['mode']};\n" + user
              open("repro/cell.sql", "w").write(script)
              # Do not pass text=True. The code under test can legitimately
              # emit bytes that are invalid in the server encoding — that is
              # the very symptom of byte-wise truncation of a multibyte
              # character — and a decode error would crash the runner on
              # exactly the case it exists to surface.
              p = subprocess.run(
                  ["psql", "-h", "/tmp/rs", "-p", "55999", "-U", "repro",
                   "-d", f"db_{c['enc']}", "-X", "-a", "-v", "ON_ERROR_STOP=0",
                   "-f", "repro/cell.sql"],
                  capture_output=True, timeout=180)
              raw = p.stdout + p.stderr
              try:
                  body, invalid = raw.decode("utf-8"), False
              except UnicodeDecodeError:
                  body, invalid = raw.decode("utf-8", "replace"), True
              out.append({"enc": c["enc"], "mode": c["mode"],
                          "out": body[:4000], "invalid_bytes": invalid})
          json.dump(out, open("repro/result.json", "w"))
          PY

      - name: stop cluster
        if: always()
        run: |
          export PATH="$PWD/inst/bin:$PATH"
          export LD_LIBRARY_PATH="$PWD/inst/lib"
          pg_ctl -D "$PWD/pgdata" stop -m immediate || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro-result
          path: |
            repro/result.json
            repro/meta.txt
          retention-days: 3

  # ---------------------------------------------------------------
  # Post the comment. Holds permissions, executes nothing.
  # ---------------------------------------------------------------
  report:
    needs: [plan, run]
    if: always() && needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: repro-result
          path: repro
        continue-on-error: true

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const MARK = "<!-- issue-repro -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;

            let cells = [], sha = "unknown";
            try {
              cells = JSON.parse(fs.readFileSync("repro/result.json", "utf8"));
              sha = (fs.readFileSync("repro/meta.txt", "utf8")
                       .match(/sha=(\w+)/) || [])[1] || sha;
            } catch (e) {
              console.log("no result artifact:", e.message);
            }

            const lines = [MARK];
            if (!cells.length) {
              lines.push(
                "The automatic reproduction did not complete — the build or",
                "execution step failed. See the workflow run log; this says",
                "nothing about the report itself."
              );
            } else {
              lines.push(
                "Ran the SQL from **Steps to reproduce** against `master` @ " +
                `\`${sha.slice(0, 12)}\`.`,
                ""
              );
              for (const c of cells) {
                lines.push(
                  `<details><summary><code>compatible_mode=${c.mode}` +
                  ` · server_encoding=${c.enc}</code></summary>`,
                  "", "```", c.out.trimEnd(), "```"
                );
                if (c.invalid_bytes) {
                  lines.push(
                    "",
                    "⚠️ This run produced bytes that do not decode as UTF-8; " +
                    "they are shown as \uFFFD. The server returned data that is " +
                    "invalid in its own encoding, which usually means a " +
                    "multibyte character was truncated byte-wise."
                  );
                }
                lines.push("</details>", "");
              }
              lines.push(
                "Run as a non-superuser role with `statement_timeout=30s` and",
                "no network access.",
                "",
                "This is an automatic run and draws no conclusion. If it",
                "disagrees with **Actual result**, compare the version,",
                "encoding and compatible mode noted above."
              );
            }

            let body = lines.join("\n");
            if (body.length > 60000) body = body.slice(0, 60000) + "\n\n…(output truncated)";

            const prior = (await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            })).find(c => c.user.type === "Bot" && (c.body || "").includes(MARK));

            if (prior) {
              if (prior.body !== body) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: prior.id, body });
              }
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body });
            }
