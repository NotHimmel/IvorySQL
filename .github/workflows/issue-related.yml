name: issue-related

# List issues that touch the same code, as context for whoever picks this up.
#
# Deliberately not framed as duplicate detection. It never labels and never
# closes, and it is not accurate enough to be trusted as a verdict — shared
# identifiers mean "these two touch the same code", which is useful context
# and nothing more. Calling it a duplicate check would promise an accuracy
# it does not have, and make every imprecise match feel like a defect.
#
# Reads the REST list and matches locally rather than using the search API,
# whose index lags issue creation by tens of seconds — exactly the window in
# which a second report of the same thing tends to arrive.

on:
  issues:
    types: [opened]

permissions:
  issues: read

jobs:
  related:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const CANDIDATES = 300;   // how many recent issues to compare against
            const SHOW = 3;

            const issue = context.payload.issue;
            const { owner, repo } = context.repo;

            const STOP = new Set([
              "select","insert","update","delete","create","table","from","where",
              "error","issue","version","result","expected","current","behavior",
              "postgres","postgresql","ivorysql","oracle","test","value","type",
              "report","should","which","because","between","string","parameter",
              "function","default","output","github","master","commit","reproduce",
              "steps","actual","additional","context","configuration","options",
              // Issue Form boilerplate, present in every submission
              "response_","_no_response_","noresponse","encoding","compatible",
              // generic prose that says nothing about which code is involved
              "created","label","labels","filing","please","through","without",
              "instead","behaviour","behavior","following","already","against",
            ]);

            // A hex run is a commit SHA, not an identifier. Two reports sharing
            // one only means they copied the same version string.
            const isHex = t => /^[0-9a-f]{7,}$/.test(t);

            const tokenize = (s) => new Set(
              (s.match(/[A-Za-z_][A-Za-z0-9_]{4,}/g) || [])
                .map(t => t.toLowerCase())
                .filter(t => !STOP.has(t) && !isHex(t))
            );

            const mine = tokenize(`${issue.title}\n${issue.body || ""}`);
            if (!mine.size) { console.log("no usable tokens"); return; }

            const all = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "all", sort: "updated", direction: "desc",
              per_page: 100,
            })).filter(i => !i.pull_request && i.number !== issue.number)
               .slice(0, CANDIDATES);

            // Weight rare identifiers higher, so a common one such as
            // `to_date` does not drown out a distinctive one.
            const docs = all.map(i => ({
              issue: i, toks: tokenize(`${i.title}\n${i.body || ""}`),
            }));
            const df = new Map();
            for (const t of mine) {
              df.set(t, docs.filter(d => d.toks.has(t)).length);
            }

            const scored = docs.map(d => {
              const shared = [...mine].filter(t => d.toks.has(t));
              const score = shared.reduce((s, t) => s + 1 / (1 + df.get(t)), 0);
              return { n: d.issue.number, title: d.issue.title,
                       state: d.issue.state, shared, score };
            }).filter(x =>
              // One shared word says nothing; two generic ones say little
              // more. Require some weight and at least one token that looks
              // like a code identifier rather than ordinary prose.
              x.shared.length >= 2 &&
              x.score >= 0.4 &&
              x.shared.some(t => t.includes("_") || t.length >= 8)
            ).sort((a, b) => b.score - a.score)
             .slice(0, SHOW);

            console.log("tokens:", [...mine].slice(0, 15));
            console.log("candidates:", all.length);
            console.log("scored:", scored.map(s =>
              `#${s.n} score=${s.score.toFixed(3)} shared=[${s.shared.join(",")}]`));

            if (!scored.length) return;

            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: [
                "<!-- issue-related -->",
                "Issues that touch the same code, for reference:",
                "",
                ...scored.map(s =>
                  `- #${s.n} ${s.title} — ${s.state}\n` +
                  `  shared identifiers: \`${s.shared.slice(0, 5).join("`, `")}\``
                ),
                "",
                "This is context, not a duplicate check — the match is only " +
                "on shared identifiers. If one of them already covers this, " +
                "the discussion is better continued there; otherwise ignore " +
                "this comment.",
              ].join("\n"),
            });
