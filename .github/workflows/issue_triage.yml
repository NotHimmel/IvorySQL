name: issue-triage

# Validate bug reports filed through the Issue Form, in two tiers:
#
#   errors   fields that make the report impossible to act on at all.
#            The issue is labelled `invalid` and closed as not planned.
#   warnings fields that look suspect but may still be usable.
#            The issue is labelled `needs-verification` and left open.
#
# Every issue also gets `needs-triage`, which a human removes once the
# issue has been dispositioned (assigned, marked help-wanted, or closed).

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  triage:
    # No label gate: an issue filed through the API or as a blank issue must
    # still land in the triage queue. What differs is how much is checked.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: stefanbuck/github-issue-parser@v3
        id: parse
        with:
          issue-body: ${{ github.event.issue.body }}
          template-path: .github/ISSUE_TEMPLATE/bug_report.yml

      - uses: actions/github-script@v7
        env:
          FIELDS: ${{ steps.parse.outputs.jsonString }}
        with:
          script: |
            // Only jsonString is reliable; the action's per-field outputs
            // come back empty.
            const f = JSON.parse(process.env.FIELDS || "{}");
            const issue = context.payload.issue;
            const { owner, repo } = context.repo;

            const NO_RESPONSE = /^_no response_$/i;
            const val = k => {
              const v = (f[k] || "").trim();
              return NO_RESPONSE.test(v) ? "" : v;
            };

            // An empty parse means the body did not come from the Bug Report
            // form — `gh issue create`, the REST API and blank issues all
            // bypass the form's own `required` validation, which is
            // client-side only. Missing fields are then not the reporter
            // ignoring the form; there was no form. Say so instead of closing.
            const fromForm = Object.keys(f).length > 0;
            const claimsBug = issue.labels.some(l => l.name === "bug");

            const errors = [];
            const warnings = [];

            // ---- E1: version cannot be traced to a tree ----
            const version = fromForm ? val("version") : "";
            const vnorm = version.toLowerCase().replace(/[\s`'"]/g, "");
            const BANNED = ["latest", "newest", "master", "head", "current",
                            "trunk", "n/a", "na", "-"];
            if (fromForm &&
                (!vnorm || BANNED.some(b => vnorm === b || vnorm.includes(b)))) {
              errors.push(
                "**IvorySQL version** is not something we can trace back to a " +
                "tree. Please give the output of `SELECT version();` or a " +
                "commit SHA, otherwise there is no way to tell which code the " +
                "report is about."
              );
            }

            // ---- E2: compatible mode missing ----
            if (fromForm && !val("compatible_mode")) {
              errors.push(
                "**Compatible mode** is missing. Behaviour differs " +
                "substantially between `oracle` and `pg` mode, so without it " +
                "the report cannot be reproduced."
              );
            }

            // ---- W1: version format unrecognised ----
            if (fromForm && !errors.length &&
                !/^\d+(\.\d+)*/.test(version) &&
                !/\d+devel/i.test(version) &&
                !/\b[0-9a-f]{7,40}\b/i.test(version)) {
              warnings.push(
                "**IvorySQL version** does not look like a version number or a " +
                "commit SHA."
              );
            }

            // ---- W2: reproduction SQL looks incomplete ----
            const sql = fromForm ? val("repro") : "";
            const KW = /\b(select|create|insert|update|delete|alter|call|do|begin)\b/i;
            const p = [];
            if (sql.replace(/\s/g, "").length < 20) p.push("it is very short");
            if (!sql.includes(";")) p.push("there is no statement terminator");
            if (!KW.test(sql)) p.push("it contains no SQL statement keyword");

            const created = new Set(
              [...sql.matchAll(/\bcreate\s+(?:global\s+|local\s+)?(?:temp\w*\s+)?(?:table|view|sequence|type|index)\s+(?:if\s+not\s+exists\s+)?([\w."]+)/gi)]
                .map(m => m[1].toLowerCase().replace(/"/g, ""))
            );
            const EXEMPT = /^(dual|pg_|sys\.|information_schema\.|generate_series)/;
            const referenced = [...sql.matchAll(/\b(?:from|into|update|join)\s+([\w."]+)/gi)]
              .map(m => m[1].toLowerCase().replace(/"/g, ""))
              .filter(t => !EXEMPT.test(t));
            const missing = [...new Set(referenced.filter(t => !created.has(t)))];
            if (missing.length) {
              p.push("it references objects it never creates: " +
                     missing.map(t => "`" + t + "`").join(", "));
            }
            if (fromForm && p.length) {
              warnings.push(
                `**Steps to reproduce** looks incomplete — ${p.join("; ")}. ` +
                "A script that can be pasted straight into psql saves a " +
                "round trip."
              );
            }

            // ---- W3: output does not look like psql or server output ----
            const out = fromForm ? val("actual") + "\n" + val("logs") : "";
            const LOGSHAPE = /(ERROR:|WARNING:|DETAIL:|HINT:|LINE \d|\(\d+ rows?\)|^-{3,}|\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})/m;
            const IMAGE_ONLY = /(!\[|<img)/.test(out) && !LOGSHAPE.test(out);
            if (fromForm && !LOGSHAPE.test(out)) {
              warnings.push(
                IMAGE_ONLY
                  ? "**Actual result** is a screenshot. Please paste the psql " +
                    "output as text so it can be searched and copied."
                  : "**Actual result** / **Relevant logs** do not look like raw " +
                    "psql or server output."
              );
            }

            // ---- W4: current master not confirmed ----
            if (fromForm && !/\[x\]\s*I confirmed the problem/i.test(issue.body || "")) {
              warnings.push(
                "The report does not confirm the problem still happens on " +
                "current `master`. Several recent reports turned out to " +
                "describe code that had already been fixed."
              );
            }

            // ---- W5: labelled a bug but not filed through the form ----
            if (!fromForm && claimsBug) {
              warnings.push(
                "This was filed outside the bug report form, so the details we " +
                "normally rely on are missing — version, compatible mode, " +
                "server encoding and a runnable reproduction. Please add them " +
                "here, or refile through " +
                `[the form](https://github.com/${context.repo.owner}/` +
                `${context.repo.repo}/issues/new?template=bug_report.yml).`
              );
            }

            // ======================= act =======================
            const MARK = "<!-- issue-triage -->";
            const add = ["needs-triage"];
            if (warnings.length) add.push("needs-verification");
            if (errors.length)   add.push("invalid");

            await github.rest.issues.addLabels({
              owner, repo, issue_number: issue.number, labels: add,
            });

            // The reporter may have edited the issue to fix things
            if (!warnings.length && !errors.length &&
                issue.labels.some(l => l.name === "needs-verification")) {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: issue.number, name: "needs-verification",
              }).catch(() => {});
            }

            const lines = [MARK];
            if (errors.length) {
              lines.push(
                "Thanks for the report. It is missing information we cannot " +
                "work around, so I am closing it for now:", ""
              );
              for (const e of errors) lines.push(`- ${e}`);
              lines.push(
                "",
                "Please reopen this issue once the details are filled in, or " +
                "file a new one — we will pick it up from there."
              );
            } else if (warnings.length) {
              lines.push(
                "Thanks for the report. A few things are worth confirming " +
                "before someone digs in:", ""
              );
              for (const w of warnings) lines.push(`- ${w}`);
              lines.push(
                "",
                "Edit the issue to add the details and this comment updates " +
                "itself."
              );
            }

            if (lines.length > 1) {
              // Keep exactly one bot comment per issue; edit it on re-runs
              const prior = (await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issue.number, per_page: 100,
              })).find(c => c.user.type === "Bot" && (c.body || "").includes(MARK));

              const body = lines.join("\n");
              if (prior) {
                if (prior.body !== body) {
                  await github.rest.issues.updateComment({
                    owner, repo, comment_id: prior.id, body });
                }
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number, body });
              }
            }

            if (errors.length && issue.state === "open") {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: issue.number, name: "needs-triage",
              }).catch(() => {});
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number,
                state: "closed", state_reason: "not_planned",
              });
            }

            const s = ["## Issue triage report", `- Issue #${issue.number}`, ""];
            if (warnings.length) {
              s.push("### Warnings");
              for (const w of warnings) s.push(`- ${w}`);
              s.push("");
            }
            if (errors.length) {
              s.push("### Errors");
              for (const e of errors) s.push(`- ${e}`);
            } else {
              s.push("### Result", "- No blocking problems found.");
            }
            await core.summary.addRaw(s.join("\n")).write();
