name: issue-triage

# Every new issue gets `needs-triage`, which a human removes once the issue
# has been dispositioned: assigned, marked help-wanted, or closed. That makes
# the untriaged queue a queryable fact rather than an impression.
#
# Anything thin or missing gets `needs-verification` plus one comment saying
# what. Deliberately a single level: this workflow never closes anything, so
# splitting the findings into "fatal" and "suspect" would have described a
# difference with no consequence.
#
# The form is guidance, not a gate. Its `validations: required` is
# client-side, so `gh issue create`, the REST API and transferred issues all
# bypass it. This runs on `issues` regardless of how the issue was created,
# and adjusts what it checks to what the body actually contains.

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: stefanbuck/github-issue-parser@v3
        id: parse
        with:
          issue-body: ${{ github.event.issue.body }}
          template-path: .github/ISSUE_TEMPLATE/bug_report.yml

      - uses: actions/github-script@v7
        env:
          FIELDS: ${{ steps.parse.outputs.jsonString }}
        with:
          script: |
            // Only jsonString is reliable; the action's per-field outputs
            // come back empty.
            const f = JSON.parse(process.env.FIELDS || "{}");
            const issue = context.payload.issue;
            const { owner, repo } = context.repo;

            // The environment field ships with pre-filled scaffolding — a
            // <details> wrapper, a console fence, the command, and a
            // "paste output here" marker. Strip all of it, so a field the
            // reporter never touched reads as empty rather than as content.
            const val = k => (f[k] || "")
              .replace(/<\/?details>/gi, "")
              .replace(/```console/gi, "")
              .replace(/```/g, "")
              .replace(/^\s*\$ .*$/gm, "")
              .replace(/#\s*paste output here/gi, "")
              .replace(/^_no response_$/im, "")
              .trim();

            // An empty parse means the body did not come from the form.
            // Missing facts are then not the reporter ignoring the form;
            // there was no form. Say so rather than judging the fields.
            const fromForm = Object.keys(f).length > 0;
            const claimsBug = issue.labels.some(l => l.name === "bug");

            const notes = [];

            // ---- not filed through the form ----
            if (!fromForm) {
              if (claimsBug) {
                notes.push(
                  "This was filed outside the bug report form, so the facts we " +
                  "normally rely on are missing — version, compatible mode and " +
                  "a reproduction. Please add them here, or refile through " +
                  `[the form](https://github.com/${owner}/${repo}/issues/new?template=bug_report.yml).`
                );
              }
            } else {
              // One field carries three facts, pasted in one go: SELECT
              // version(), SHOW ivorysql.compatible_mode, SHOW server_encoding.
              const env = val("ivoryVersion");

              const hasVersion =
                /\bIvorySQL\b/i.test(env) ||
                /\b\d+\.\d+/.test(env) ||
                /\b\d+devel\b/i.test(env) ||
                /\b[0-9a-f]{7,40}\b/i.test(env);
              const VAGUE = /\b(latest|newest|current|trunk|n\/?a)\b/i;
              if (!hasVersion || (VAGUE.test(env) && !/\bIvorySQL\b/i.test(env))) {
                notes.push(
                  "**IvorySQL version and compatible mode** has no version we " +
                  "can trace back to a tree. Please paste the output of " +
                  "`SELECT version()`, or give a commit SHA — otherwise there " +
                  "is no way to tell which code the report is about."
                );
              }

              if (!/\b(oracle|pg)\b/i.test(env)) {
                notes.push(
                  "**IvorySQL version and compatible mode** does not say which " +
                  "mode this happens in. Behaviour differs substantially " +
                  "between `oracle` and `pg` — down to whether `''` is NULL and " +
                  "whether `DUAL` exists — so without it the report cannot be " +
                  "reproduced. `SHOW ivorysql.compatible_mode` gives it."
                );
              }

              const ENCODINGS = /\b(UTF8|SQL_ASCII|GB18030|EUC_CN|EUC_JP|EUC_KR|LATIN\d|WIN\d+)\b/i;
              if (!ENCODINGS.test(env)) {
                notes.push(
                  "The version block does not include `SHOW server_encoding`. " +
                  "Anything touching multibyte characters behaves differently " +
                  "per encoding, so it is worth having even when it looks " +
                  "unrelated."
                );
              }

              if (val("repro").replace(/\s/g, "").length < 40) {
                notes.push(
                  "**How can we reproduce it** is very short. Whatever it " +
                  "takes — SQL, shell commands, a configuration, a sequence of " +
                  "sessions — is worth spelling out. A reproduction someone " +
                  "can follow is usually what decides whether a report gets " +
                  "picked up."
                );
              }

              // Deliberately does not require output that looks like psql's:
              // crashes, build failures and hangs are real reports that
              // produce no row count. Only the two cases that cost a round
              // trip.
              const problem = val("problem");
              const textOnly = problem
                .replace(/!\[[^\]]*\]\([^)]*\)|<img[^>]*>/g, "")
                .replace(/\s/g, "");
              if (/(!\[|<img)/.test(problem) && textOnly.length < 20) {
                notes.push(
                  "**What happened?** is a screenshot with little text. Please " +
                  "paste the output as text as well, so it can be searched, " +
                  "quoted, and copied into a test."
                );
              } else if (textOnly.length < 20) {
                notes.push(
                  "**What happened?** is very short. Real output pasted as " +
                  "text is the single most useful thing a report can carry."
                );
              }

              if (!/\[x\]\s*I confirmed the problem/i.test(issue.body || "")) {
                notes.push(
                  "The report does not confirm the problem still happens on " +
                  "current `master`. Several recent reports turned out to " +
                  "describe code that had already been fixed."
                );
              }
            }

            // ======================= act =======================
            const MARK = "<!-- issue-triage -->";
            const labels = ["needs-triage"];
            if (notes.length) labels.push("needs-verification");

            await github.rest.issues.addLabels({
              owner, repo, issue_number: issue.number, labels,
            });

            // The reporter may have edited the issue to fix things.
            if (!notes.length &&
                issue.labels.some(l => l.name === "needs-verification")) {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: issue.number,
                name: "needs-verification",
              }).catch(() => {});
            }

            // Keep exactly one bot comment per issue; edit it on re-runs. When
            // nothing is left to say the earlier comment must be rewritten
            // rather than left behind, or it keeps asking for details that
            // have since been supplied.
            const prior = (await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issue.number, per_page: 100,
            })).find(c => c.user.type === "Bot" && (c.body || "").includes(MARK));

            const body = notes.length
              ? [
                  MARK,
                  "Thanks for the report. A few things are worth filling in " +
                  "before someone digs in:",
                  "",
                  ...notes.map(n => `- ${n}`),
                  "",
                  "Edit the issue to add them and this comment updates itself.",
                ].join("\n")
              : MARK + "\nThe details are all filled in — thanks. Nothing " +
                       "further needed from my side.";

            if (prior) {
              if (prior.body !== body) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: prior.id, body });
              }
            } else if (notes.length) {
              // Nothing to say and nothing said before: stay quiet.
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number, body });
            }

            const s = ["## Issue triage report", `- Issue #${issue.number}`,
                       `- Filed through the form: ${fromForm}`,
                       `- Notes: ${notes.length}`, ""];
            for (const n of notes) s.push(`- ${n}`);
            if (!notes.length) s.push("- Nothing to report.");
            await core.summary.addRaw(s.join("\n")).write();
