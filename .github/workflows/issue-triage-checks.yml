name: Issue triage checks

on:
  pull_request:
    paths: ['.github/triage/**', '.github/ISSUE_TEMPLATE/**', '.github/workflows/issue-triage*.yml']
  push:
    paths: ['.github/triage/**', '.github/ISSUE_TEMPLATE/**', '.github/workflows/issue-triage*.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s .github/triage -p 'test_*.py' -v
