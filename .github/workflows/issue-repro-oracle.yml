name: issue-repro-oracle

# 把同一段复现 SQL 送到真 Oracle 上，回答「Oracle 到底怎么做」。
#
# 这把 "Oracle 的参照行为是什么" 从「需要判断」降级成「可执行」：
#   CREATE TABLE t(a LONG(2));  →  ORA-03074
# 不需要模型，也不需要有人恰好记得 Oracle 的规则。
#
# 自包含：不依赖仓库里的 compose 文件或脚本。
# 只手动触发（/repro oracle）—— 镜像约 3 GB，首次启动数分钟。

on:
  issue_comment:
    types: [created]

concurrency:
  group: issue-repro-oracle-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  ORA_IMAGE: container-registry.oracle.com/database/free:23.26.0.0-lite
  ORA_PWD: ci_only_throwaway

jobs:
  gate:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    permissions:
      issues: read
    outputs:
      go: ${{ steps.check.outputs.go }}
      sql: ${{ steps.check.outputs.sql }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: stefanbuck/github-issue-parser@v3
        id: parse
        with:
          issue-body: ${{ github.event.issue.body }}
          template-path: .github/ISSUE_TEMPLATE/bug_report.yml

      - id: check
        uses: actions/github-script@v7
        env:
          FIELDS: ${{ steps.parse.outputs.jsonString }}
        with:
          script: |
            const cmd = (context.payload.comment.body || "").trim().toLowerCase();
            if (cmd !== "/repro oracle") { core.setOutput("go", "false"); return; }

            // 只有维护者能触发 —— Oracle 侧成本高
            const { data: perm } =
              await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo, username: context.payload.comment.user.login,
              }).catch(() => ({ data: { permission: "none" } }));
            const ok = perm.permission === "admin" || perm.permission === "write";
            if (!ok) { core.setOutput("go", "false"); return; }

            const f = JSON.parse(process.env.FIELDS || "{}");
            const sql = (f.repro || "")
              .replace(/^\s*```[a-zA-Z]*\s*\n/, "")
              .replace(/\n\s*```\s*$/, "")
              .trim();
            core.setOutput("sql", sql);
            core.setOutput("go", String(sql.length >= 10));

  oracle:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {}          # 与 issue-repro 一致：执行侧无凭据
    steps:
      - name: materialise repro SQL
        uses: actions/github-script@v7
        env:
          REPRO_SQL: ${{ needs.gate.outputs.sql }}
        with:
          script: |
            const fs = require("fs");
            fs.mkdirSync("repro", { recursive: true });
            // sqlplus 需要显式退出，否则 stdin 结束后会挂住
            const body = [
              "SET HEADING ON FEEDBACK ON PAGESIZE 50 LINESIZE 200",
              "WHENEVER SQLERROR CONTINUE",
              "WHENEVER OSERROR CONTINUE",
              process.env.REPRO_SQL || "",
              "EXIT",
            ].join("\n") + "\n";
            fs.writeFileSync("repro/oracle.sql", body);

      - name: pull oracle image
        run: docker pull "$ORA_IMAGE"

      - name: start oracle
        run: |
          set -eu
          docker run -d --name ora -e ORACLE_PWD="$ORA_PWD" \
                 --shm-size=1g "$ORA_IMAGE"
          # 首次启动要解包并打开数据库
          for i in $(seq 1 120); do
            st=$(docker inspect -f '{{.State.Health.Status}}' ora 2>/dev/null || echo starting)
            [ "$st" = "healthy" ] && { echo "oracle healthy after ${i}0s"; exit 0; }
            [ "$st" = "unhealthy" ] && break
            sleep 10
          done
          echo "oracle did not become healthy" >&2
          docker logs --tail=60 ora >&2
          exit 1

      - name: run against oracle
        run: |
          set -o pipefail
          docker exec -i ora bash -lc \
            "sqlplus -S system/$ORA_PWD@localhost/FREEPDB1" \
            < repro/oracle.sql 2>&1 | tee repro/oracle.txt

      - name: stop oracle
        if: always()
        run: docker rm -f ora || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro-oracle
          path: repro/oracle.txt
          retention-days: 3

  report:
    needs: [gate, oracle]
    if: always() && needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: repro-oracle
          path: repro
        continue-on-error: true

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const MARK = "<!-- issue-repro-oracle -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;

            let out = "";
            try { out = fs.readFileSync("repro/oracle.txt", "utf8"); } catch {}

            const body = out.trim()
              ? [
                  MARK,
                  "在 Oracle Database Free 23c 上执行了同一段 SQL：",
                  "", "```", out.slice(0, 20000).trimEnd(), "```", "",
                  "本条为自动执行结果，不含判断。若 Oracle 的行为与报告中的",
                  "「预期结果」不一致，说明这份报告的前提需要重新确认。",
                ].join("\n")
              : [
                  MARK,
                  "Oracle 侧执行未能完成 —— 容器启动或执行阶段失败，详见运行日志。",
                  "这不代表报告有问题。",
                ].join("\n");

            const prior = (await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            })).find(c => c.user.type === "Bot" && (c.body || "").includes(MARK));

            if (prior) {
              if (prior.body !== body) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: prior.id, body });
              }
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body });
            }
