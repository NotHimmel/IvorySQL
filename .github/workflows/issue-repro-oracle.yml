name: issue-repro-oracle

# Run the same reproduction SQL against a real Oracle, so that "what does
# Oracle actually do here" stops being a matter of recall:
#   CREATE TABLE t(a LONG(2));  ->  ORA-03074
#
# Self-contained: does not depend on any compose file or script in the repo.
# Manual trigger only (/repro oracle) — the image is roughly 3 GB and the
# first open takes minutes.

on:
  issue_comment:
    types: [created]

concurrency:
  group: issue-repro-oracle-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  ORA_IMAGE: container-registry.oracle.com/database/free:23.26.0.0-lite
  ORA_PWD: ci_only_throwaway

jobs:
  gate:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    permissions:
      issues: read
    outputs:
      go: ${{ steps.check.outputs.go }}
      sql: ${{ steps.check.outputs.sql }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: stefanbuck/github-issue-parser@v3
        id: parse
        with:
          issue-body: ${{ github.event.issue.body }}
          template-path: .github/ISSUE_TEMPLATE/bug_report.yml

      - id: check
        uses: actions/github-script@v7
        env:
          FIELDS: ${{ steps.parse.outputs.jsonString }}
        with:
          script: |
            const cmd = (context.payload.comment.body || "").trim().toLowerCase();
            if (cmd !== "/repro oracle") { core.setOutput("go", "false"); return; }

            // Maintainers only; the Oracle side is expensive
            const { data: perm } =
              await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo, username: context.payload.comment.user.login,
              }).catch(() => ({ data: { permission: "none" } }));
            const ok = perm.permission === "admin" || perm.permission === "write";
            if (!ok) { core.setOutput("go", "false"); return; }

            const f = JSON.parse(process.env.FIELDS || "{}");
            const sql = (f.repro || "")
              .replace(/^\s*```[a-zA-Z]*\s*\n/, "")
              .replace(/\n\s*```\s*$/, "")
              .trim();
            core.setOutput("sql", sql);
            core.setOutput("go", String(sql.length >= 10));

  oracle:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {}          # Same as issue-repro: the executing side holds no credentials
    steps:
      - name: materialise repro SQL
        uses: actions/github-script@v7
        env:
          REPRO_SQL: ${{ needs.gate.outputs.sql }}
        with:
          script: |
            const fs = require("fs");
            fs.mkdirSync("repro", { recursive: true });
            // sqlplus needs an explicit EXIT or it hangs after stdin closes
            const body = [
              "SET HEADING ON FEEDBACK ON PAGESIZE 50 LINESIZE 200",
              "WHENEVER SQLERROR CONTINUE",
              "WHENEVER OSERROR CONTINUE",
              process.env.REPRO_SQL || "",
              "EXIT",
            ].join("\n") + "\n";
            fs.writeFileSync("repro/oracle.sql", body);

      - name: pull oracle image
        run: docker pull "$ORA_IMAGE"

      - name: start oracle
        run: |
          set -eu
          docker run -d --name ora -e ORACLE_PWD="$ORA_PWD" \
                 --shm-size=1g "$ORA_IMAGE"
          # The first start unpacks and opens the database
          for i in $(seq 1 120); do
            st=$(docker inspect -f '{{.State.Health.Status}}' ora 2>/dev/null || echo starting)
            [ "$st" = "healthy" ] && { echo "oracle healthy after ${i}0s"; exit 0; }
            [ "$st" = "unhealthy" ] && break
            sleep 10
          done
          echo "oracle did not become healthy" >&2
          docker logs --tail=60 ora >&2
          exit 1

      - name: run against oracle
        run: |
          set -o pipefail
          docker exec -i ora bash -lc \
            "sqlplus -S system/$ORA_PWD@localhost/FREEPDB1" \
            < repro/oracle.sql 2>&1 | tee repro/oracle.txt

      - name: stop oracle
        if: always()
        run: docker rm -f ora || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro-oracle
          path: repro/oracle.txt
          retention-days: 3

  report:
    needs: [gate, oracle]
    if: always() && needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: repro-oracle
          path: repro
        continue-on-error: true

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const MARK = "<!-- issue-repro-oracle -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;

            let out = "";
            try { out = fs.readFileSync("repro/oracle.txt", "utf8"); } catch {}

            const body = out.trim()
              ? [
                  MARK,
                  "Ran the same SQL against Oracle Database Free 23c:",
                  "", "```", out.slice(0, 20000).trimEnd(), "```", "",
                  "This is an automatic run and draws no conclusion. If",
                  "Oracle disagrees with **Expected result**, the premise of",
                  "the report needs another look.",
                ].join("\n")
              : [
                  MARK,
                  "The Oracle run did not complete — the container failed to",
                  "start or the execution step failed. See the run log. This",
                  "says nothing about the report itself.",
                ].join("\n");

            const prior = (await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            })).find(c => c.user.type === "Bot" && (c.body || "").includes(MARK));

            if (prior) {
              if (prior.body !== body) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: prior.id, body });
              }
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body });
            }
