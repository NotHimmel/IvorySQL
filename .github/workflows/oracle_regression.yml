name: oracle_regression

on:
  workflow_dispatch:
  push:
    branches: [ master , IVORY_REL_5_STABLE, IVORY_REL_4_STABLE , IVORYSQL_REL_1_STABLE]
  pull_request:
    branches: [ master , IVORY_REL_5_STABLE, IVORY_REL_4_STABLE , IVORYSQL_REL_1_STABLE]

jobs:
  oracle_regression:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v4
    - name: dependancy
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git lcov bison flex pkg-config \
              libssl-dev libldap-dev libpam-dev python3-dev \
              tcl-dev libperl-dev gettext libxml2-dev libxslt-dev \
              libreadline-dev uuid-dev zlib1g-dev \
              libipc-run-perl libtime-hires-perl libtest-simple-perl \
              libicu-dev liblz4-dev libselinux1-dev
    - name: configure - linux
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: |
        ./configure \
            --prefix="$PWD/inst" 'CFLAGS=-O2 -g' \
            --enable-nls \
            --enable-tap-tests \
            --with-tcl \
            --with-perl \
            --with-python \
            --with-pam \
            --with-ldap \
            --with-selinux \
            --with-readline \
            --with-openssl \
            --with-libxml \
            --with-libxslt \
            --with-uuid=e2fs \
            --with-lz4 \
            --with-icu
    - name: compile
      run: make -j2 && make install

    - name: report build configuration
      run: |
        ./src/bin/pg_config/pg_config --version
        ./src/bin/pg_config/pg_config --configure

    - name: oracle_regression
      run: make oracle-check-world

    - name: collect files
      if: failure()
      run: |
          find . \( -name "config.log" -or -name "*.diffs" -or -name "regression.out" -or -name "oracle_regression.out" -or -path '*/tmp_check/log' -or -path '*/regress/log' \) -print0 |
                xargs -0 tar -czf oracle_regression.tar.gz
    - name: upload oracle_regression files
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: results
        path: ${{ github.workspace }}/oracle_regression.tar.gz

  compression_without_lz4:
    name: compression without LZ4
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bison flex pkg-config \
            libicu-dev libreadline-dev zlib1g-dev uuid-dev
    - name: configure without LZ4
      run: |
        ./configure \
            --prefix="$PWD/inst" \
            --enable-cassert --enable-debug --with-uuid=e2fs --without-lz4 \
            --with-extra-version="-ci"
    - name: compile
      run: make -j2
    - name: report build configuration
      run: |
        ./src/bin/pg_config/pg_config --version
        ./src/bin/pg_config/pg_config --configure
    - name: compression regression without LZ4
      # compression uses the fipshash helpers created by test_setup.
      run: make oracle-check-tests TESTS='test_setup compression'
    - name: upload compression failure files
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: compression-without-lz4-results
        path: |
          config.log
          src/oracle_test/regress/regression.diffs
          src/oracle_test/regress/regression.out
          src/oracle_test/regress/log/
          src/oracle_test/regress/tmp_check/log/
          tmp_install/log/
