name: oracle_regression

on:
  workflow_dispatch:
  push:
    branches: [ master , IVORY_REL_5_STABLE, IVORY_REL_4_STABLE , IVORYSQL_REL_1_STABLE]
  pull_request:
    branches: [ master , IVORY_REL_5_STABLE, IVORY_REL_4_STABLE , IVORYSQL_REL_1_STABLE]

defaults:
  run:
    shell: bash

env:
  # initdb derives the default database encoding from the container locale.
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  oracle_regression:
    name: oracle-check (Rocky Linux 10)
    runs-on: ubuntu-latest
    container:
      image: rockylinux/rockylinux:10
      options: --shm-size=1g

    steps:
    - name: install Rocky Linux 10 build dependencies
      run: |
        cat /etc/os-release
        dnf -y --enablerepo=crb install \
            gcc gcc-c++ make git bison flex pkgconf-pkg-config \
            gettext gettext-devel tcl-devel \
            perl perl-devel perl-ExtUtils-Embed perl-IPC-Run \
            perl-Time-HiRes perl-Test-Simple python3-devel \
            pam-devel openldap-devel libselinux-devel readline-devel \
            openssl-devel libxml2-devel libxslt-devel libuuid-devel \
            lz4-devel libicu-devel zlib-devel glibc-langpack-en \
            tar gzip findutils diffutils which procps-ng hostname \
            shadow-utils util-linux
        useradd --create-home highgo
    - uses: actions/checkout@v4
    - name: prepare non-root build directory
      run: |
        chown -R highgo:highgo "$GITHUB_WORKSPACE"
    - name: configure
      run: |
        runuser -u highgo -- bash -e <<'BUILD'
        cd "$GITHUB_WORKSPACE"
        ./configure \
            --prefix="$PWD/inst" 'CFLAGS=-O2 -g' \
            --enable-nls \
            --enable-tap-tests \
            --with-tcl \
            --with-perl \
            --with-python \
            --with-pam \
            --with-ldap \
            --with-selinux \
            --with-readline \
            --with-openssl \
            --with-libxml \
            --with-libxslt \
            --with-uuid=e2fs \
            --with-lz4 \
            --with-icu
        BUILD
    - name: compile
      run: |
        runuser -u highgo -- bash -e <<'BUILD'
        cd "$GITHUB_WORKSPACE"
        make -j2
        make install
        BUILD

    - name: report build configuration
      run: |
        cat /etc/os-release
        locale
        gcc --version
        ./src/bin/pg_config/pg_config --version
        ./src/bin/pg_config/pg_config --configure

    - name: oracle-check
      run: |
        runuser -u highgo -- bash -e <<'TEST'
        cd "$GITHUB_WORKSPACE"
        make oracle-check
        TEST

    - name: collect files
      if: failure()
      run: |
          find . \( -name "config.log" -or -name "*.diffs" -or -name "regression.out" -or -name "oracle_regression.out" -or -path '*/tmp_check/log' -or -path '*/regress/log' \) -print0 |
                xargs -0 tar -czf oracle_regression.tar.gz
    - name: upload oracle_regression files
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: results
        path: ${{ github.workspace }}/oracle_regression.tar.gz

  compression_without_lz4:
    name: compression without LZ4 (Rocky Linux 10)
    runs-on: ubuntu-latest
    container:
      image: rockylinux/rockylinux:10
      options: --shm-size=1g
    timeout-minutes: 30

    steps:
    - name: install Rocky Linux 10 build dependencies
      run: |
        cat /etc/os-release
        dnf -y --enablerepo=crb install \
            gcc gcc-c++ make git bison flex pkgconf-pkg-config \
            perl perl-IPC-Run perl-Time-HiRes perl-Test-Simple \
            libicu-devel readline-devel zlib-devel libuuid-devel \
            libxml2-devel glibc-langpack-en \
            tar gzip findutils diffutils which procps-ng hostname \
            shadow-utils util-linux
        useradd --create-home highgo
    - uses: actions/checkout@v4
    - name: prepare non-root build directory
      run: |
        chown -R highgo:highgo "$GITHUB_WORKSPACE"
    - name: configure without LZ4
      run: |
        runuser -u highgo -- bash -e <<'BUILD'
        cd "$GITHUB_WORKSPACE"
        ./configure \
            --prefix="$PWD/inst" \
            --enable-cassert --enable-debug --with-uuid=e2fs --without-lz4 \
            --with-extra-version="-ci"
        BUILD
    - name: compile
      run: |
        runuser -u highgo -- bash -e <<'BUILD'
        cd "$GITHUB_WORKSPACE"
        make -j2
        BUILD
    - name: report build configuration
      run: |
        cat /etc/os-release
        locale
        gcc --version
        ./src/bin/pg_config/pg_config --version
        ./src/bin/pg_config/pg_config --configure
    - name: compression regression without LZ4
      # compression uses the fipshash helpers created by test_setup.
      run: |
        runuser -u highgo -- bash -e <<'TEST'
        cd "$GITHUB_WORKSPACE"
        make oracle-check-tests TESTS='test_setup compression'
        TEST
    - name: upload compression failure files
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: compression-without-lz4-results
        path: |
          config.log
          src/oracle_test/regress/regression.diffs
          src/oracle_test/regress/regression.out
          src/oracle_test/regress/log/
          src/oracle_test/regress/tmp_check/log/
          tmp_install/log/
