name: Bug Report
description: Report a bug encountered while using IvorySQL
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: |
        Please provide as much info as possible. Not doing so may result in your bug not being addressed in a timely manner.
        Real output pasted as text is far more useful than a description of it, and far more useful than a screenshot.
        If this matter is security related, please disclose it privately as described in [SECURITY.md](https://github.com/IvorySQL/IvorySQL/blob/master/.github/SECURITY.md)
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: |
        If the expectation comes from Oracle, please include the real Oracle output and the Oracle version it came from.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How can we reproduce it (as minimally and precisely as possible)?
      description: |
        Whatever it takes — SQL, shell commands, a configuration, a sequence of sessions. Not every problem reduces to a script, so please write what actually reproduces it.
    validations:
      required: true

  - type: dropdown
    id: version
    attributes:
      label: IvorySQL version
      description: |
        `SELECT version()`. If you built from source or the release is not listed, pick the closest entry and give the exact version or commit SHA under "Anything else we need to know?".
      options:
        - master (built from source)
        - IvorySQL 5.4
        - IvorySQL 5.3
        - IvorySQL 5.1
        - IvorySQL 5.0
        - IvorySQL 4.6
        - IvorySQL 4.5
        - IvorySQL 4.4
        - IvorySQL 4.2
        - IvorySQL 4.0
        - IvorySQL 1.23
        - IvorySQL 1.22
        - IvorySQL 1.17
        - IvorySQL 3.x or older
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: compatible_mode
    attributes:
      label: Compatible mode
      description: |
        `SHOW ivorysql.compatible_mode`. Behaviour differs substantially between the two — down to whether `''` is NULL and whether `DUAL` exists.
      options:
        - oracle
        - pg
        - Both
    validations:
      required: true

  - type: dropdown
    id: server_encoding
    attributes:
      label: Server encoding
      description: "`SHOW server_encoding`"
      options:
        - UTF8
        - GB18030
        - SQL_ASCII
        - EUC_CN
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Anything else we need to know?
      description: |
        Server logs, how the instance was set up, non-default settings, installed extensions — anything that seemed relevant.

  - type: textarea
    id: osVersion
    attributes:
      label: OS version
      value: |
        <details>

        ```console
        $ cat /etc/os-release
        # paste output here
        $ uname -a
        # paste output here
        ```

        </details>

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I confirmed the problem still happens on current `master`
        - label: I searched existing issues and found no duplicate
