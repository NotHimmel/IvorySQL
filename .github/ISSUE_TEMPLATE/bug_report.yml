name: "🐛 Bug Report"
description: Something does not behave as expected
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please give as much detail as you can. Reports that leave out the
        version or the compatible mode usually cannot be acted on at all.

        If this is a security issue, please report it privately instead —
        see [SECURITY.md](https://github.com/IvorySQL/IvorySQL/blob/master/.github/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: IvorySQL version
      description: >
        The output of `SELECT version();`, or a commit SHA. Values such as
        `latest`, `newest` or `master` cannot be traced back to a tree.
      placeholder: "IvorySQL 4.5 ... or ba264e96bfe"
    validations:
      required: true

  - type: dropdown
    id: compatible_mode
    attributes:
      label: Compatible mode
      description: "`SHOW ivorysql.compatible_mode;`"
      options:
        - oracle
        - pg
        - Happens in both modes
        - Unrelated to compatible mode
    validations:
      required: true

  - type: dropdown
    id: server_encoding
    attributes:
      label: Server encoding
      description: "`SHOW server_encoding;`"
      options:
        - UTF8
        - GB18030
        - SQL_ASCII
        - EUC_CN
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: >
        What you observed. Real output pasted as text is far more useful than
        a description of it, and far more useful than a screenshot.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: >
        If the expectation comes from Oracle, please include the real Oracle
        output and the version it came from.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How can we reproduce it, as minimally and precisely as possible?
      description: >
        Whatever it takes — SQL, shell commands, a configuration, a sequence
        of sessions. Not every problem reduces to a script, so write what
        actually reproduces it.


        One thing worth knowing: if part of it is a self-contained SQL script
        and you put it in a ```sql code block, CI will run that block against
        current `master` and post the real output here. That often settles a
        report in one round instead of three.
    validations:
      required: true

  - type: textarea
    id: anything_else
    attributes:
      label: Anything else we need to know?
      description: >
        Server logs, build configuration, how the instance was set up,
        anything that seemed relevant.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I confirmed the problem still happens on current `master`
        - label: I searched existing issues and found no duplicate
