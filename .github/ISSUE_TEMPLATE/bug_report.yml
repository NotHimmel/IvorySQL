name: "🐛 Bug Report"
description: Something does not behave as expected
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please confirm the problem still happens on current
        `master`, and search for an existing issue covering it.

  - type: input
    id: version
    attributes:
      label: IvorySQL version
      description: >
        The output of `SELECT version();`, or a commit SHA.
        Values such as `latest`, `newest` or `master` cannot be traced back
        to a tree and are not accepted.
      placeholder: "IvorySQL 4.5 ... or ba264e96bfe"
    validations:
      required: true

  - type: dropdown
    id: compatible_mode
    attributes:
      label: Compatible mode
      description: "`SHOW ivorysql.compatible_mode;`"
      options:
        - oracle
        - pg
        - Happens in both modes
        - Unrelated to compatible mode
    validations:
      required: true

  - type: dropdown
    id: server_encoding
    attributes:
      label: Server encoding
      description: >
        `SHOW server_encoding;` — required for anything involving
        multibyte characters.
      options:
        - UTF8
        - GB18030
        - SQL_ASCII
        - EUC_CN
        - Other / not sure
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "output of uname -a"

  - type: textarea
    id: configure
    attributes:
      label: Build configuration
      description: "`config.status --config`, or the meson setup arguments"
      render: shell

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: >
        A complete SQL script that can be pasted straight into psql,
        including any CREATE statements it depends on. Please do not
        describe the steps in prose.
      render: sql
      placeholder: |
        CREATE TABLE t(a varchar2(10 byte));
        INSERT INTO t VALUES ('...');
        SELECT lengthb(a) FROM t;
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Paste the real psql output rather than summarising it
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: >
        If the expectation comes from Oracle, please include the real
        Oracle output and the Oracle version it came from.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server log excerpts
      render: text

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I confirmed the problem still happens on current `master`
        - label: I searched existing issues and found no duplicate
