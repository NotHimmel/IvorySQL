name: "🚀 Feature Request"
description: Propose a new feature.
labels: ["type/feature"]
body:
  - type: dropdown
    id: ai_usage
    attributes:
      label: AI usage
      description: Did you use AI to discover, investigate, or write this issue?
      options: ["Not used", "Used"]
      default: 0
    validations:
      required: true

  - type: input
    id: ai_model
    attributes:
      label: AI model
      description: If you selected Used, provide model names and versions (up to five, separated by commas). Leave blank for Not used. A tool name alone is insufficient.
      placeholder: org/model-a-v2, model-b-v1
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Feature Request
      description: Describe the feature you would like to propose and its use case.
    validations:
      required: true
