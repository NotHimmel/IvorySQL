name: Issue triage report
description: Report a bug, request a feature, or propose an enhancement
body:
  - type: dropdown
    id: issue_type
    attributes:
      label: Issue type
      description: Optional. Choose a type if known, or leave blank for automatic classification.
      options: [bug, feature, enhancement]
    validations:
      required: false
  - type: dropdown
    id: ai_usage
    attributes:
      label: AI usage
      description: Did you use AI to discover, investigate, or write this issue?
      options: ["Not used", "Used"]
      default: 0
    validations:
      required: true

  - type: input
    id: ai_model
    attributes:
      label: AI model
      description: If you selected Used, provide model names and versions (up to five, separated by commas). Leave blank for Not used. A tool name alone is insufficient.
      placeholder: org/model-a-v2, model-b-v1
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem or the use case and expected behavior for the requested change.
    validations:
      required: true
  - type: input
    id: database_version
    attributes:
      label: Database version
      description: For bugs, provide the full database version or commit ID.
      placeholder: PostgreSQL 18.1
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Operating system and architecture
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: For bugs, provide numbered steps or minimal SQL, plus expected and actual results.
  - type: dropdown
    id: actual_reproduction
    attributes:
      label: Reproduced in a real environment
      description: For bugs, have you personally run the steps with the reported version? Running the real module or build code counts; predicted output alone does not.
      options: ["Yes", "No", "Not verified yet"]
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: For bugs, describe what should happen and include expected output when available.
  - type: input
    id: compatible_mode
    attributes:
      label: Compatible mode
      description: For database behavior bugs, provide SHOW ivorysql.compatible_mode output (oracle, pg, or both), or write "not applicable" with a reason. Not required for build-only problems.
  - type: input
    id: server_encoding
    attributes:
      label: Server encoding
      description: For database behavior bugs, provide SHOW server_encoding output, or write "not applicable" with a reason. Not required for build-only problems.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Include relevant errors or stack traces, if available.
